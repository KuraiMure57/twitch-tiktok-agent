name: Prueba publicación TikTok

on:
  workflow_dispatch:

jobs:
  tiktok-publish-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      # === PASO NUEVO: Instalar el navegador invisible en el servidor ===
      - name: Instalar navegador de Playwright
        run: |
          playwright install chromium --with-deps

      # Creas tus metadatos de prueba igual que antes
      - name: Crear metadata de prueba
        run: |
          cat > metadata.json <<'EOF'
          {
            "title": "Prueba de publicación TikTok - KuraiMure57",
            "hashtags": [
              "#Gaming",
              "#Twitch",
              "#KuraiMure57"
            ]
          }
          EOF

      # Ejecutamos el script simulando un monitor virtual con xvfb-run
      - name: Publicar vídeo de prueba en TikTok
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run --server-args="-screen 0 1366x768x24" python src/tiktok_uploader.py \
            src/tiktok_test.mp4 \
            metadata.json

      # Forzamos a que guarde la imagen siempre, pase lo que pase
      - name: Descargar captura de pantalla de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-debug-image
          path: debug_tiktok.png

          uses: actions/upload-artifact@v4
          with:

      # Este paso lo dejamos para que compruebe si tu script generó el reporte final
      - name: Mostrar resultado de publicación
        if: always()
        run: |
          if [ -f tiktok_result.json ]; then
            python - <<'PY'
          import json

          with open(
              "tiktok_result.json",
              "r",
              encoding="utf-8",
          ) as file:
              result = json.load(file)

          safe_result = {
              "status": result.get("status"),
              "publish_id": result.get("publish_id"),
              "post_ids": result.get("post_ids"),
              "caption": result.get("caption"),
          }

          print(
              json.dumps(
                  safe_result,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY
          else
            echo "No se generó tiktok_result.json."
          fi
