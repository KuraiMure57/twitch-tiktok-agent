name: Whisper Test

on:
  workflow_dispatch:

concurrency:
  group: twitch-tiktok-telegram-review
  cancel-in-progress: false

jobs:
  whisper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests
          pip install yt-dlp

      # ============================================================
      # TWITCH
      # ============================================================

      - name: Obtain Twitch App Access Token
        id: twitch-token
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          client_id = os.environ.get("TWITCH_CLIENT_ID")
          client_secret = os.environ.get("TWITCH_CLIENT_SECRET")

          if not client_id:
              print("ERROR: Falta TWITCH_CLIENT_ID.")
              sys.exit(1)

          if not client_secret:
              print("ERROR: Falta TWITCH_CLIENT_SECRET.")
              sys.exit(1)

          response = requests.post(
              "https://id.twitch.tv/oauth2/token",
              headers={
                  "Content-Type": "application/x-www-form-urlencoded"
              },
              data={
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "grant_type": "client_credentials",
              },
              timeout=30,
          )

          try:
              data = response.json()
          except ValueError:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print(json.dumps(data, ensure_ascii=False, indent=2))
              sys.exit(1)

          access_token = data.get("access_token")

          if not access_token:
              print("ERROR: Twitch no devolvió access_token.")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"access_token={access_token}\n")

          print("Twitch App Access Token obtenido correctamente.")
          print(f"Duración: {data.get('expires_in')} segundos.")
          PY

      - name: Validate Twitch App Access Token
        env:
          TWITCH_ACCESS_TOKEN: ${{ steps.twitch-token.outputs.access_token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          token = os.environ.get("TWITCH_ACCESS_TOKEN")

          response = requests.get(
              "https://id.twitch.tv/oauth2/validate",
              headers={
                  "Authorization": f"OAuth {token}"
              },
              timeout=30,
          )

          print(f"Twitch /oauth2/validate: HTTP {response.status_code}")

          try:
              data = response.json()
          except ValueError:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print(json.dumps(data, ensure_ascii=False, indent=2))
              sys.exit(1)

          print("Twitch App Access Token válido.")
          print(f"Client ID: {data.get('client_id')}")
          print(f"Expira en: {data.get('expires_in')} segundos.")
          PY

      - name: Get Twitch broadcaster ID
        id: twitch-user
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ steps.twitch-token.outputs.access_token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          response = requests.get(
              "https://api.twitch.tv/helix/users",
              params={
                  "login": "kuraimure57"
              },
              headers={
                  "Authorization": f"Bearer {os.environ['TWITCH_ACCESS_TOKEN']}",
                  "Client-Id": os.environ["TWITCH_CLIENT_ID"],
              },
              timeout=30,
          )

          print(f"Twitch /helix/users: HTTP {response.status_code}")

          try:
              data = response.json()
          except ValueError:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print(json.dumps(data, ensure_ascii=False, indent=2))
              sys.exit(1)

          users = data.get("data", [])

          if not users:
              print("ERROR: No se encontró @kuraimure57.")
              sys.exit(1)

          user = users[0]
          user_id = user.get("id")

          if not user_id:
              print("ERROR: Twitch no devolvió el ID.")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"user_id={user_id}\n")

          print("Cuenta Twitch encontrada.")
          print(f"Usuario: @{user.get('login')}")
          print(f"Nombre mostrado: {user.get('display_name')}")
          print(f"Broadcaster ID: {user_id}")
          PY

      # ============================================================
      # OBTENER CLIPS REALES DE TWITCH
      # ============================================================

      - name: Get latest Twitch clips
        id: twitch-clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ steps.twitch-token.outputs.access_token }}
          TWITCH_BROADCASTER_ID: ${{ steps.twitch-user.outputs.user_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone

          import requests

          now = datetime.now(timezone.utc)
          seven_days_ago = now - timedelta(days=7)

          started_at = seven_days_ago.strftime("%Y-%m-%dT%H:%M:%SZ")
          ended_at = now.strftime("%Y-%m-%dT%H:%M:%SZ")

          print("")
          print("========================================")
          print("BUSCANDO CLIPS DE LOS ÚLTIMOS 7 DÍAS")
          print("========================================")
          print(f"Desde: {started_at}")
          print(f"Hasta: {ended_at}")
          print("")

          response = requests.get(
              "https://api.twitch.tv/helix/clips",
              params={
                  "broadcaster_id": os.environ["TWITCH_BROADCASTER_ID"],
                  "started_at": started_at,
                  "ended_at": ended_at,
                  "first": 100,
              },
              headers={
                  "Authorization": f"Bearer {os.environ['TWITCH_ACCESS_TOKEN']}",
                  "Client-Id": os.environ["TWITCH_CLIENT_ID"],
              },
              timeout=30,
          )

          print(f"Twitch /helix/clips: HTTP {response.status_code}")

          try:
              data = response.json()
          except ValueError:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print(json.dumps(data, ensure_ascii=False, indent=2))
              sys.exit(1)

          clips = data.get("data", [])

          if not clips:
              print("")
              print("========================================")
              print("NO HAY CLIPS EN LOS ÚLTIMOS 7 DÍAS")
              print("========================================")
              print("")
              print(
                  "El workflow se detiene para evitar procesar "
                  "accidentalmente un clip antiguo."
              )
              sys.exit(1)

          clips.sort(
              key=lambda clip: clip.get("created_at", ""),
              reverse=True,
          )

          print("")
          print("==============================")
          print(f"CLIPS ENCONTRADOS: {len(clips)}")
          print("==============================")

          for index, clip in enumerate(clips, start=1):
              print(f"\n--- Clip {index} ---")
              print(f"ID: {clip.get('id')}")
              print(f"Título: {clip.get('title')}")
              print(f"Fecha: {clip.get('created_at')}")
              print(f"Duración: {clip.get('duration')} s")
              print(f"Vistas: {clip.get('view_count')}")
              print(f"URL: {clip.get('url')}")

          clip = clips[0]

          with open(
              "selected_twitch_clip.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  clip,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("========================================")
          print("CLIP MÁS RECIENTE SELECCIONADO")
          print("========================================")
          print(f"ID: {clip.get('id')}")
          print(f"Título: {clip.get('title')}")
          print(f"Fecha: {clip.get('created_at')}")
          print(f"Duración: {clip.get('duration')} s")
          print(f"Vistas: {clip.get('view_count')}")
          print(f"URL: {clip.get('url')}")
          PY

      - name: Upload Twitch clips information
        uses: actions/upload-artifact@v4
        with:
          name: twitch-clips-information
          path: selected_twitch_clip.json
          if-no-files-found: error

      # ============================================================
      # DESCARGAR CLIP REAL DE TWITCH
      # ============================================================

      - name: Download selected Twitch clip
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          with open(
              "selected_twitch_clip.json",
              "r",
              encoding="utf-8",
          ) as f:
              clip = json.load(f)

          clip_url = clip.get("url")

          if not clip_url:
              print("ERROR: Twitch no devolvió la URL del clip.")
              sys.exit(1)

          print("")
          print("==============================")
          print("DESCARGANDO CLIP DE TWITCH")
          print("==============================")
          print(f"ID: {clip.get('id')}")
          print(f"Título: {clip.get('title')}")
          print(f"Fecha: {clip.get('created_at')}")
          print(f"Duración API: {clip.get('duration')} s")
          print(f"URL: {clip_url}")
          print("")

          subprocess.run(
              [
                  "yt-dlp",
                  "--no-playlist",
                  "--no-warnings",
                  "--remux-video",
                  "mp4",
                  "-o",
                  "twitch_clip.%(ext)s",
                  clip_url,
              ],
              check=True,
          )
          PY

          echo ""
          echo "=============================="
          echo "VERIFICANDO CLIP DESCARGADO"
          echo "=============================="

          if [ ! -f twitch_clip.mp4 ]; then
            echo "ERROR: No se ha creado twitch_clip.mp4"
            echo "Archivos encontrados:"
            ls -lah
            exit 1
          fi

          echo "Clip descargado correctamente:"
          ls -lh twitch_clip.mp4

          echo ""
          echo "Información del vídeo:"

          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            twitch_clip.mp4

      - name: Upload downloaded Twitch clip
        uses: actions/upload-artifact@v4
        with:
          name: twitch-clip-source
          path: twitch_clip.mp4
          if-no-files-found: error

      # ============================================================
      # WHISPER
      # ============================================================

      - name: Run Whisper
        run: |
          python src/transcribe.py twitch_clip.mp4 output.txt

      - name: Show Whisper output
        run: |
          cat output.txt

      - name: Show Whisper JSON
        run: |
          cat output.json

      # ============================================================
      # SUBTÍTULOS BASADOS EN PALABRAS
      # ============================================================

      - name: Format subtitles
        run: |
          python src/subtitle_formatter.py \
            output.json \
            formatted_subtitles.json

      - name: Show formatted subtitles
        run: |
          cat formatted_subtitles.json

      - name: Correct subtitles
        run: |
          python src/subtitle_corrector.py \
            formatted_subtitles.json \
            corrected_subtitles.json

      - name: Show corrected subtitles
        run: |
          cat corrected_subtitles.json

      # ============================================================
      # GEMINI
      # ============================================================

      - name: Build AI input
        run: |
          python - <<'PY'
          import json

          with open(
              "corrected_subtitles.json",
              "r",
              encoding="utf-8",
          ) as f:
              subtitles = json.load(f)

          ai_input = {
              "language": subtitles.get("language", "es"),
              "segments": subtitles.get("segments", []),
              "instructions": {
                  "correct_transcription": True,
                  "preserve_timestamps": True,
                  "never_change_timestamps": True,
                  "return_only_valid_json": True,
              },
          }

          with open(
              "ai_input.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  ai_input,
                  f,
                  ensure_ascii=False,
                  indent=2,
              )
          PY

      - name: Analyze video with Gemini
        run: |
          python src/gemini_analyzer.py \
            twitch_clip.mp4 \
            ai_input.json \
            ai_response.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Show AI response
        run: |
          cat ai_response.json

      - name: Validate AI response
        run: |
          python src/ai_response_validator.py ai_response.json

      - name: Show AI input
        run: |
          cat ai_input.json

      # ============================================================
      # SCORING / METADATA
      # ============================================================

      - name: Calculate score
        run: |
          python src/scoring.py \
            ai_response.json \
            scored_response.json

      - name: Show scored response
        run: |
          cat scored_response.json

      - name: Generate clip metadata
        run: |
          python src/metadata_generator.py \
            scored_response.json \
            metadata.json

      - name: Show clip metadata
        run: |
          cat metadata.json

      # ============================================================
      # SUBTÍTULOS FINALES
      # ============================================================

      - name: Build final subtitles
        run: |
          python src/ai_response_handler.py \
            ai_response.json \
            corrected_subtitles.json \
            final_subtitles.txt

      - name: Show final subtitles
        run: |
          cat final_subtitles.txt

      # ============================================================
      # IMPORTANTE:
      # twitch_clip.mp4 YA ES EL CLIP FINAL DE TWITCH.
      #
      # NO SE VUELVE A RECORTAR.
      #
      # El proyecto trabaja con TODO el clip descargado,
      # manteniendo su duración original.
      # ============================================================

      - name: Verify original Twitch clip duration
        run: |
          echo "=============================="
          echo "DURACIÓN DEL CLIP ORIGINAL"
          echo "=============================="

          duration=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            twitch_clip.mp4)

          echo "Duración: ${duration}s"

      # ============================================================
      # VÍDEO VERTICAL
      # ============================================================

      - name: Create vertical TikTok video
        run: |
          python src/video_editor.py \
            twitch_clip.mp4 \
            tiktok_clip.mp4

      - name: Verify vertical TikTok video
        run: |
          ls -lh tiktok_clip.mp4

          echo ""
          echo "Duración del TikTok:"
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            tiktok_clip.mp4

          echo ""
          echo "Resolución:"
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height \
            -of default=noprint_wrappers=1 \
            tiktok_clip.mp4

      # ============================================================
      # SUBTÍTULOS
      # ============================================================

      - name: Burn subtitles into TikTok video
        run: |
          python src/subtitle_burner.py \
            tiktok_clip.mp4 \
            final_subtitles.txt \
            final_tiktok.mp4

      - name: Verify final TikTok video
        run: |
          ls -lh final_tiktok.mp4

          echo ""
          echo "Duración final:"
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final_tiktok.mp4

      # ============================================================
      # TELEGRAM
      # ============================================================

      - name: Create review state
        run: |
          python src/review_manager.py \
            create \
            metadata.json \
            review_state.json

      - name: Send clip to Telegram for review
        id: telegram_review
        timeout-minutes: 125
        run: |
          python src/telegram_review.py \
            final_tiktok.mp4 \
            metadata.json \
            review_state.json \
            final_subtitles.txt \
            tiktok_clip.mp4 \
            7200

          echo "status=$(cat review_result.txt)" >> "$GITHUB_OUTPUT"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Show review state
        run: |
          cat review_state.json

      # ============================================================
      # PUBLICACIÓN
      # ============================================================

      - name: Prepare publication package
        if: steps.telegram_review.outputs.status == 'approved'
        run: |
          mkdir -p publication_package

          cp final_tiktok.mp4 publication_package/
          cp metadata.json publication_package/
          cp review_state.json publication_package/

      - name: Show publication package
        if: steps.telegram_review.outputs.status == 'approved'
        run: |
          ls -lh publication_package/

          echo "--- metadata.json ---"
          cat publication_package/metadata.json

          echo "--- review_state.json ---"
          cat publication_package/review_state.json

      - name: Upload publication package
        if: steps.telegram_review.outputs.status == 'approved'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-publication-package
          path: publication_package/
          if-no-files-found: error

      - name: Publish approved clip to TikTok
        if: steps.telegram_review.outputs.status == 'approved'
        run: |
          python src/tiktok_uploader.py \
            final_tiktok.mp4 \
            metadata.json
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}

      - name: Show TikTok publication result
        if: steps.telegram_review.outputs.status == 'approved'
        run: |
          cat tiktok_result.json

      - name: Report rejected clip
        if: steps.telegram_review.outputs.status == 'rejected'
        run: |
          echo "El clip ha sido descartado desde Telegram."
