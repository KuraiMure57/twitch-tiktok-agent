name: Twitch Test

on:
  workflow_dispatch:

jobs:
  twitch-test:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Comprobar cuenta de Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          client_id = os.environ["TWITCH_CLIENT_ID"]
          access_token = os.environ["TWITCH_ACCESS_TOKEN"]

          response = requests.get(
              "https://api.twitch.tv/helix/users",
              headers={
                  "Client-ID": client_id,
                  "Authorization": f"Bearer {access_token}",
              },
              timeout=30,
          )

          print(
              f"Twitch /helix/users: HTTP {response.status_code}"
          )

          if not response.ok:
              print(response.text)
              sys.exit(1)

          data = response.json()

          users = data.get("data", [])

          if not users:
              print("ERROR: Twitch no devolvió ningún usuario.")
              sys.exit(1)

          user = users[0]

          print(
              f"Usuario Twitch: @{user.get('login')}"
          )

          print(
              f"Display name: {user.get('display_name')}"
          )

          print("Autenticación Twitch correcta.")

          with open(
              "twitch_user.json",
              "w",
              encoding="utf-8",
          ) as file:
              import json

              json.dump(
                  {
                      "id": user.get("id"),
                      "login": user.get("login"),
                      "display_name": user.get("display_name"),
                  },
                  file,
                  ensure_ascii=False,
                  indent=2,
              )
          PY

      - name: Buscar clips recientes
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests

          client_id = os.environ["TWITCH_CLIENT_ID"]
          access_token = os.environ["TWITCH_ACCESS_TOKEN"]

          with open(
              "twitch_user.json",
              "r",
              encoding="utf-8",
          ) as file:
              user = json.load(file)

          broadcaster_id = user["id"]

          response = requests.get(
              "https://api.twitch.tv/helix/clips",
              headers={
                  "Client-ID": client_id,
                  "Authorization": f"Bearer {access_token}",
              },
              params={
                  "broadcaster_id": broadcaster_id,
                  "first": 10,
              },
              timeout=30,
          )

          print(
              f"Twitch /helix/clips: HTTP {response.status_code}"
          )

          if not response.ok:
              print(response.text)
              sys.exit(1)

          data = response.json()

          clips = data.get("data", [])

          print(
              f"Clips encontrados: {len(clips)}"
          )

          for index, clip in enumerate(clips, start=1):
              print("")
              print(
                  f"--- Clip {index} ---"
              )
              print(
                  f"ID: {clip.get('id')}"
              )
              print(
                  f"Título: {clip.get('title')}"
              )
              print(
                  f"URL: {clip.get('url')}"
              )
              print(
                  f"Created: {clip.get('created_at')}"
              )
              print(
                  f"Creator: {clip.get('creator_name')}"
              )
              print(
                  f"Video ID: {clip.get('video_id')}"
              )

          with open(
              "twitch_clips.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  clips,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("Consulta de clips completada correctamente.")
          PY

      - name: Mostrar resultado
        run: |
          echo "--- Usuario ---"
          cat twitch_user.json

          echo ""
          echo "--- Clips ---"
          cat twitch_clips.json
