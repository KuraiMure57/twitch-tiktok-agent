name: Whisper Test

on:
  workflow_dispatch:

jobs:
  whisper-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Whisper installation
        run: |
          python -c "import whisper; print('Whisper instalado correctamente')"

      - name: Transcribe test video
        run: |
          python src/transcribe.py src/tiktok_test.mp4 output.txt

      - name: Show transcription
        run: |
          cat output.txt

      - name: Show transcription JSON
        run: |
          cat output.json

      - name: Format subtitle text
        run: |
          python src/subtitle_formatter.py output.json formatted_subtitles.json

      - name: Show formatted subtitles
        run: |
          cat formatted_subtitles.json
          
      - name: Correct subtitle text
        run: |
          python src/subtitle_corrector.py formatted_subtitles.json corrected_subtitles.json

      - name: Show corrected subtitles
        run: |
          cat corrected_subtitles.json
      
      - name: Build AI input
        run: |
          python -c "
          import json

          with open('corrected_subtitles.json', 'r', encoding='utf-8') as f:
              subtitles = json.load(f)

          ai_input = {
              'language': subtitles.get('language', 'es'),
              'segments': subtitles.get('segments', []),
              'instructions': {
                  'correct_transcription': True,
                  'preserve_timestamps': True,
                  'return_only_valid_json': True
              }
          }

          with open('ai_input.json', 'w', encoding='utf-8') as f:
              json.dump(ai_input, f, ensure_ascii=False, indent=2)
          "

      - name: Show AI input
        run: |
          cat ai_input.json

      - name: Validate AI response
        run: |
          python src/ai_response_validator.py ai_response_test.json

      - name: Show test AI response
        run: |
          cat ai_response_test.json

      - name: Build subtitles
        run: |
          python src/subtitle_builder.py output.txt subtitles.txt
