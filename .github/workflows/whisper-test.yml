name: Whisper Test

on:
  workflow_dispatch:

concurrency:
  group: twitch-tiktok-telegram-review
  cancel-in-progress: false

jobs:
  whisper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Refresh Twitch User Access Token
        id: twitch-token
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          import requests

          client_id = os.environ.get("TWITCH_CLIENT_ID")
          client_secret = os.environ.get("TWITCH_CLIENT_SECRET")
          refresh_token = os.environ.get("TWITCH_REFRESH_TOKEN")

          if not client_id:
              print("ERROR: Falta el secret TWITCH_CLIENT_ID.")
              sys.exit(1)

          if not client_secret:
              print("ERROR: Falta el secret TWITCH_CLIENT_SECRET.")
              sys.exit(1)

          if not refresh_token:
              print("ERROR: Falta el secret TWITCH_REFRESH_TOKEN.")
              sys.exit(1)

          response = requests.post(
              "https://id.twitch.tv/oauth2/token",
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
              },
              data={
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "grant_type": "refresh_token",
                  "refresh_token": refresh_token,
              },
              timeout=30,
          )

          try:
              data = response.json()
          except ValueError:
              print("ERROR: Twitch devolvió una respuesta no válida.")
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print("ERROR renovando User Access Token de Twitch:")
              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  )
              )
              sys.exit(1)

          access_token = data.get("access_token")

          if not access_token:
              print("ERROR: Twitch no devolvió access_token.")
              sys.exit(1)

          expires_in = data.get("expires_in")
          scopes = data.get("scope", [])

          new_refresh_token = data.get("refresh_token")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"access_token={access_token}\n"
              )

              if new_refresh_token:
                  output.write(
                      f"refresh_token={new_refresh_token}\n"
                  )

          print("Twitch User Access Token renovado correctamente.")
          print(f"Duración del token: {expires_in} segundos.")
          print(f"Scopes concedidos: {scopes}")

          if new_refresh_token:
              print(
                  "Twitch ha proporcionado un nuevo Refresh Token."
              )
              print(
                  "IMPORTANTE: si Twitch rota el Refresh Token, "
                  "habrá que actualizar el secret "
                  "TWITCH_REFRESH_TOKEN."
              )
          else:
              print(
                  "Twitch no ha proporcionado un nuevo Refresh Token."
              )

          print("Los tokens no se mostrarán en los logs.")
          PY

      - name: Validate Twitch User Access Token
        env:
          TWITCH_ACCESS_TOKEN: ${{ steps.twitch-token.outputs.access_token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          import requests

          access_token = os.environ.get("TWITCH_ACCESS_TOKEN")

          if not access_token:
              print("ERROR: No se obtuvo Twitch User Access Token.")
              sys.exit(1)

          response = requests.get(
              "https://id.twitch.tv/oauth2/validate",
              headers={
                  "Authorization": f"OAuth {access_token}",
              },
              timeout=30,
          )

          print(
              f"Twitch /oauth2/validate: HTTP "
              f"{response.status_code}"
          )

          try:
              data = response.json()
          except ValueError:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  )
              )
              sys.exit(1)

          print("Twitch User Access Token válido.")
          print(f"Client ID: {data.get('client_id')}")
          print(f"Login: {data.get('login')}")
          print(f"User ID: {data.get('user_id')}")
          print(f"Scopes: {data.get('scopes')}")
          print(
              f"Expira en: {data.get('expires_in')} segundos"
          )
          PY

      - name: Get Twitch broadcaster ID
        id: twitch-user
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ steps.twitch-token.outputs.access_token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          import requests

          client_id = os.environ["TWITCH_CLIENT_ID"]
          access_token = os.environ["TWITCH_ACCESS_TOKEN"]

          response = requests.get(
              "https://api.twitch.tv/helix/users",
              params={
                  "login": "kuraimure57",
              },
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Client-Id": client_id,
              },
              timeout=30,
          )

          print(
              f"Twitch /helix/users: HTTP "
              f"{response.status_code}"
          )

          try:
              data = response.json()
          except ValueError:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  )
              )
              sys.exit(1)

          users = data.get("data", [])

          if not users:
              print(
                  "ERROR: No se encontró el usuario "
                  "Twitch @kuraimure57."
              )
              sys.exit(1)

          user = users[0]
          user_id = user.get("id")

          if not user_id:
              print(
                  "ERROR: Twitch no devolvió el ID del usuario."
              )
              sys.exit(1)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"user_id={user_id}\n"
              )

          print("Cuenta Twitch encontrada.")
          print(f"Usuario: @{user.get('login')}")
          print(
              f"Nombre mostrado: {user.get('display_name')}"
          )
          print(f"Broadcaster ID: {user_id}")
          PY

      - name: Get latest Twitch clips
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ steps.twitch-token.outputs.access_token }}
          TWITCH_BROADCASTER_ID: ${{ steps.twitch-user.outputs.user_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          import requests

          client_id = os.environ["TWITCH_CLIENT_ID"]
          access_token = os.environ["TWITCH_ACCESS_TOKEN"]
          broadcaster_id = os.environ["TWITCH_BROADCASTER_ID"]

          response = requests.get(
              "https://api.twitch.tv/helix/clips",
              params={
                  "broadcaster_id": broadcaster_id,
                  "first": 20,
              },
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Client-Id": client_id,
              },
              timeout=30,
          )

          print(
              f"Twitch /helix/clips: HTTP "
              f"{response.status_code}"
          )

          try:
              data = response.json()
          except ValueError:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  )
              )
              sys.exit(1)

          clips = data.get("data", [])

          print("")
          print("==============================")
          print("CLIPS ENCONTRADOS EN TWITCH")
          print("==============================")
          print("")

          if not clips:
              print(
                  "ERROR: No se han encontrado clips "
                  "para @kuraimure57."
              )
              sys.exit(1)

          print(
              f"Total de clips recibidos: "
              f"{len(clips)}"
          )
          print("")

          for index, clip in enumerate(
              clips,
              start=1,
          ):
              print(
                  f"--- Clip {index} ---"
              )
              print(
                  f"ID: {clip.get('id')}"
              )
              print(
                  f"Título: {clip.get('title')}"
              )
              print(
                  f"Creador: {clip.get('creator_name')}"
              )
              print(
                  f"Juego: {clip.get('game_name')}"
              )
              print(
                  f"Fecha: {clip.get('created_at')}"
              )
              print(
                  f"Duración: {clip.get('duration')} segundos"
              )
              print(
                  f"Vistas: {clip.get('view_count')}"
              )
              print(
                  f"URL: {clip.get('url')}"
              )
              print("")

          with open(
              "twitch_clips.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  clips,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          latest_clip = max(
              clips,
              key=lambda clip: clip.get(
                  "created_at",
                  "",
              ),
          )

          clip_id = latest_clip.get("id")

          if not clip_id:
              print(
                  "ERROR: El clip seleccionado "
                  "no tiene ID."
              )
              sys.exit(1)

          print("")
          print("==============================")
          print("CLIP SELECCIONADO")
          print("==============================")
          print(
              f"ID: {clip_id}"
          )
          print(
              f"Título: {latest_clip.get('title')}"
          )
          print(
              f"Fecha: {latest_clip.get('created_at')}"
          )
          print(
              f"URL: {latest_clip.get('url')}"
          )
          print(
              f"Duración: {latest_clip.get('duration')} segundos"
          )
          print("==============================")
          print("")

          with open(
              "selected_twitch_clip.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  latest_clip,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"clip_id={clip_id}\n"
              )

      - name: Get Twitch clip download URL
        id: twitch-download
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ steps.twitch-token.outputs.access_token }}
          TWITCH_CLIP_ID: ${{ steps.twitch-clips.outputs.clip_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          import requests

          client_id = os.environ["TWITCH_CLIENT_ID"]
          access_token = os.environ["TWITCH_ACCESS_TOKEN"]
          clip_id = os.environ["TWITCH_CLIP_ID"]

          response = requests.get(
              "https://api.twitch.tv/helix/clips/downloads",
              params={
                  "editor_id": clip_id,
              },
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Client-Id": client_id,
              },
              timeout=30,
          )

          print(
              f"Twitch /helix/clips/downloads: HTTP "
              f"{response.status_code}"
          )

          try:
              data = response.json()
          except ValueError:
              print(response.text)
              sys.exit(1)

          if response.status_code != 200:
              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  )
              )
              sys.exit(1)

          print(
              "Respuesta de descarga recibida."
          )

          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Upload Twitch clips information
        uses: actions/upload-artifact@v4
        with:
          name: twitch-clips-information
          path: |
            twitch_clips.json
            selected_twitch_clip.json
          if-no-files-found: error

      - name: Run Whisper
        run: |
          python src/transcribe.py src/tiktok_test.mp4 output.txt

      - name: Show Whisper output
        run: |
          cat output.txt

      - name: Show Whisper JSON
        run: |
          cat output.json

      - name: Format subtitles
        run: |
          python src/subtitle_formatter.py output.json formatted_subtitles.json

      - name: Show formatted subtitles
        run: |
          cat formatted_subtitles.json

      - name: Correct subtitles
        run: |
          python src/subtitle_corrector.py formatted_subtitles.json corrected_subtitles.json

      - name: Show corrected subtitles
        run: |
          cat corrected_subtitles.json

      - name: Build AI input
        run: |
          python -c "
          import json

          with open('corrected_subtitles.json', 'r', encoding='utf-8') as f:
              subtitles = json.load(f)

          ai_input = {
              'language': subtitles.get('language', 'es'),
              'segments': subtitles.get('segments', []),
              'instructions': {
                  'correct_transcription': True,
                  'preserve_timestamps': True,
                  'return_only_valid_json': True
              }
          }

          with open('ai_input.json', 'w', encoding='utf-8') as f:
              json.dump(ai_input, f, ensure_ascii=False, indent=2)
          "

      - name: Analyze video with Gemini
        run: |
          python src/gemini_analyzer.py src/tiktok_test.mp4 ai_input.json ai_response.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Show AI response
        run: |
          cat ai_response.json

      - name: Validate AI response
        run: |
          python src/ai_response_validator.py ai_response.json

      - name: Show AI input
        run: |
          cat ai_input.json

      - name: Calculate score
        run: |
          python src/scoring.py ai_response.json scored_response.json

      - name: Show scored response
        run: |
          cat scored_response.json

      - name: Generate clip metadata
        run: |
          python src/metadata_generator.py \
            scored_response.json \
            metadata.json

      - name: Show clip metadata
        run: |
          cat metadata.json

      - name: Build final subtitles
        run: |
          python src/ai_response_handler.py \
            ai_response.json \
            final_subtitles.txt

      - name: Show final subtitles
        run: |
          cat final_subtitles.txt

      - name: Extract clip
        run: |
          python src/clip_extractor.py \
            src/tiktok_test.mp4 \
            scored_response.json \
            clip.mp4

      - name: Verify clip
        run: |
          ls -lh clip.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            clip.mp4

      - name: Create vertical TikTok video
        run: |
          python src/video_editor.py \
            clip.mp4 \
            tiktok_clip.mp4

      - name: Verify vertical TikTok video
        run: |
          ls -lh tiktok_clip.mp4
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height \
            -of default=noprint_wrappers=1 \
            tiktok_clip.mp4

      - name: Burn subtitles into TikTok video
        run: |
          python src/subtitle_burner.py \
            tiktok_clip.mp4 \
            final_subtitles.txt \
            final_tiktok.mp4

      - name: Verify final TikTok video
        run: |
          ls -lh final_tiktok.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final_tiktok.mp4

      - name: Create review state
        run: |
          python src/review_manager.py \
            create \
            metadata.json \
            review_state.json

      - name: Send clip to Telegram for review
        id: telegram_review
        timeout-minutes: 125
        run: |
          python src/telegram_review.py \
            final_tiktok.mp4 \
            metadata.json \
            review_state.json \
            final_subtitles.txt \
            tiktok_clip.mp4 \
            7200

          echo "status=$(cat review_result.txt)" >> "$GITHUB_OUTPUT"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Show review state
        run: |
          cat review_state.json

      - name: Prepare publication package
        if: steps.telegram_review.outputs.status == 'approved'
        run: |
          mkdir -p publication_package

          cp final_tiktok.mp4 publication_package/
          cp metadata.json publication_package/
          cp review_state.json publication_package/

      - name: Show publication package
        if: steps.telegram_review.outputs.status == 'approved'
        run: |
          ls -lh publication_package/

          echo "--- metadata.json ---"
          cat publication_package/metadata.json

          echo "--- review_state.json ---"
          cat publication_package/review_state.json

      - name: Upload publication package
        if: steps.telegram_review.outputs.status == 'approved'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-publication-package
          path: publication_package/
          if-no-files-found: error

      - name: Publish approved clip to TikTok
        if: steps.telegram_review.outputs.status == 'approved'
        run: |
          python src/tiktok_uploader.py \
            final_tiktok.mp4 \
            metadata.json
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}

      - name: Show TikTok publication result
        if: steps.telegram_review.outputs.status == 'approved'
        run: |
          cat tiktok_result.json

      - name: Report rejected clip
        if: steps.telegram_review.outputs.status == 'rejected'
        run: |
          echo "El clip ha sido descartado desde Telegram."
