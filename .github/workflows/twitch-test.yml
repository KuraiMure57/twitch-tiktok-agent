name: Twitch Test

on:
  workflow_dispatch:

jobs:
  twitch-test:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validar Access Token de Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          client_id = os.environ["TWITCH_CLIENT_ID"]
          access_token = os.environ["TWITCH_ACCESS_TOKEN"]

          response = requests.get(
              "https://id.twitch.tv/oauth2/validate",
              headers={
                  "Authorization": f"Bearer {access_token}",
              },
              timeout=30,
          )

          print(
              f"Twitch /oauth2/validate: HTTP {response.status_code}"
          )

          if not response.ok:
              print(response.text)
              sys.exit(1)

          data = response.json()

          token_client_id = data.get("client_id")
          login = data.get("login")
          user_id = data.get("user_id")
          expires_in = data.get("expires_in")
          scopes = data.get("scopes", [])

          print(
              f"Cuenta autorizada: @{login}"
          )

          print(
              f"User ID: {user_id}"
          )

          print(
              f"Client ID del token: {token_client_id}"
          )

          print(
              f"Client ID configurado en GitHub: {client_id}"
          )

          print(
              f"Scopes: {scopes}"
          )

          print(
              f"Expira en: {expires_in} segundos"
          )

          if token_client_id != client_id:
              print("")
              print(
                  "ERROR: El Access Token pertenece a otro Client ID."
              )
              print(
                  "El token debe generarse utilizando el Client ID "
                  "que está guardado en TWITCH_CLIENT_ID."
              )
              sys.exit(1)

          print("")
          print(
              "Access Token válido y perteneciente a esta aplicación."
          )
          PY

      - name: Comprobar cuenta mediante API
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          client_id = os.environ["TWITCH_CLIENT_ID"]
          access_token = os.environ["TWITCH_ACCESS_TOKEN"]

          response = requests.get(
              "https://api.twitch.tv/helix/users",
              headers={
                  "Client-ID": client_id,
                  "Authorization": f"Bearer {access_token}",
              },
              timeout=30,
          )

          print(
              f"Twitch /helix/users: HTTP {response.status_code}"
          )

          if not response.ok:
              print(response.text)
              sys.exit(1)

          data = response.json()
          users = data.get("data", [])

          if not users:
              print(
                  "ERROR: Twitch no devolvió ningún usuario."
              )
              sys.exit(1)

          user = users[0]

          print(
              f"Usuario Twitch: @{user.get('login')}"
          )

          print(
              f"Display name: {user.get('display_name')}"
          )

          print(
              f"User ID: {user.get('id')}"
          )

          print("")
          print(
              "Autenticación Twitch correcta."
          )
          PY

      - name: Buscar clips recientes
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_ACCESS_TOKEN: ${{ secrets.TWITCH_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          client_id = os.environ["TWITCH_CLIENT_ID"]
          access_token = os.environ["TWITCH_ACCESS_TOKEN"]

          user_response = requests.get(
              "https://api.twitch.tv/helix/users",
              headers={
                  "Client-ID": client_id,
                  "Authorization": f"Bearer {access_token}",
              },
              timeout=30,
          )

          if not user_response.ok:
              print(user_response.text)
              sys.exit(1)

          users = user_response.json().get(
              "data",
              [],
          )

          if not users:
              print(
                  "ERROR: No se pudo obtener el usuario."
              )
              sys.exit(1)

          broadcaster_id = users[0]["id"]

          response = requests.get(
              "https://api.twitch.tv/helix/clips",
              headers={
                  "Client-ID": client_id,
                  "Authorization": f"Bearer {access_token}",
              },
              params={
                  "broadcaster_id": broadcaster_id,
                  "first": 10,
              },
              timeout=30,
          )

          print(
              f"Twitch /helix/clips: HTTP {response.status_code}"
          )

          if not response.ok:
              print(response.text)
              sys.exit(1)

          clips = response.json().get(
              "data",
              [],
          )

          print(
              f"Clips encontrados: {len(clips)}"
          )

          for index, clip in enumerate(
              clips,
              start=1,
          ):
              print("")
              print(
                  f"--- Clip {index} ---"
              )
              print(
                  f"ID: {clip.get('id')}"
              )
              print(
                  f"Título: {clip.get('title')}"
              )
              print(
                  f"URL: {clip.get('url')}"
              )
              print(
                  f"Fecha: {clip.get('created_at')}"
              )
              print(
                  f"Creador: {clip.get('creator_name')}"
              )

          print("")
          print(
              "Consulta de clips completada correctamente."
          )
          PY
