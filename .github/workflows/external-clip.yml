name: External Clip

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "GitHub Actions artifact ID del proyecto twitch-vod-clip-agent con los MP4"
        required: true
        type: string
      manifest_artifact_id:
        description: "GitHub Actions artifact ID del proyecto twitch-vod-clip-agent con clips_manifest.json"
        required: true
        type: string
      clip_filename:
        description: "Nombre del MP4 dentro del artifact"
        required: true
        type: string
  # CAMBIO AQUÍ: Añadimos el receptor automático para escuchar al Proyecto 2
  repository_dispatch:
    types: [vod_clips_approved]

concurrency:
  group: twitch-tiktok-telegram-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  external-clip:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # FFMPEG
      # ============================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg instalado:"
          ffmpeg -version | head -n 1


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests
          pip install yt-dlp


      # ============================================================
      # DESCARGAR CLIP EXTERNO
      # ============================================================

      - name: Download approved clip artifact
        # CAMBIO AQUÍ: Hacemos que las variables detecten si la ejecución es manual o automática
        env:
          SOURCE_REPOSITORY: KuraiMure57/twitch-vod-clip-agent
          ARTIFACT_ID: ${{ github.event.client_payload.artifact_id || inputs.artifact_id }}
          MANIFEST_ARTIFACT_ID: ${{ github.event.client_payload.manifest_artifact_id || inputs.manifest_artifact_id }}
          CLIP_FILENAME: ${{ github.event.client_payload.clip_filename || inputs.clip_filename }}
          GITHUB_TOKEN_CROSS_REPO: ${{ secrets.CROSS_REPO_TOKEN }}

        run: |
          set -euo pipefail

          if [ -z "${GITHUB_TOKEN_CROSS_REPO:-}" ]; then
            echo "ERROR: Falta el secret CROSS_REPO_TOKEN."
            exit 1
          fi

          echo "========================================"
          echo "DESCARGANDO CLIP EXTERNO"
          echo "========================================"

          echo "Repositorio origen: ${SOURCE_REPOSITORY}"
          echo "Artifact de clips: ${ARTIFACT_ID}"
          echo "Artifact del manifest: ${MANIFEST_ARTIFACT_ID}"
          echo "Archivo solicitado: ${CLIP_FILENAME}"


          # --------------------------------------------------------
          # DESCARGAR ARTIFACT DE LOS MP4
          # --------------------------------------------------------

          echo ""
          echo "Descargando artifact de clips..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN_CROSS_REPO}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output external_clip_artifact.zip


          mkdir -p external_clip_artifact

          unzip -q \
            external_clip_artifact.zip \
            -d external_clip_artifact


          echo ""
          echo "Contenido del artifact de clips:"

          find external_clip_artifact \
            -maxdepth 3 \
            -type f \
            -print


          MATCHED_FILE="$(
            find external_clip_artifact \
              -type f \
              -name "${CLIP_FILENAME}" \
              -print \
              -quit
          )"


          if [ -z "${MATCHED_FILE}" ]; then
            echo ""
            echo "ERROR: No se encontró ${CLIP_FILENAME} dentro del artifact."
            exit 1
          fi


          cp \
            "${MATCHED_FILE}" \
            twitch_clip.mp4


          if [ ! -s twitch_clip.mp4 ]; then
            echo "ERROR: twitch_clip.mp4 está vacío."
            exit 1
          fi


          # --------------------------------------------------------
          # DESCARGAR ARTIFACT DEL MANIFEST
          # --------------------------------------------------------

          echo ""
          echo "Descargando artifact del manifest..."


          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN_CROSS_REPO}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}/actions/artifacts/${MANIFEST_ARTIFACT_ID}/zip" \
            --output external_manifest_artifact.zip


          mkdir -p external_manifest_artifact

          unzip -q \
            external_manifest_artifact.zip \
            -d external_manifest_artifact


          echo ""
          echo "Contenido del artifact del manifest:"

          find external_manifest_artifact \
            -maxdepth 3 \
            -type f \
            -print


          MANIFEST_FILE="$(
            find external_manifest_artifact \
              -type f \
              -name "clips_manifest.json" \
              -print \
              -quit
          )"


          if [ -z "${MANIFEST_FILE}" ]; then
            echo ""
            echo "ERROR: No se encontró clips_manifest.json."
            exit 1
          fi


          cp \
            "${MANIFEST_FILE}" \
            clips_manifest.json


          if [ ! -s clips_manifest.json ]; then
            echo "ERROR: clips_manifest.json está vacío."
            exit 1
          fi


          echo ""
          echo "Manifest preparado:"
          ls -lh clips_manifest.json


          echo ""
          echo "========================================"
          echo "MANIFEST RECIBIDO DE PROYECTO 2"
          echo "========================================"

          cat clips_manifest.json


          echo ""
          echo "========================================"
          echo "CLIP EXTERNO PREPARADO"
          echo "========================================"

          ls -lh twitch_clip.mp4


          echo ""
          echo "DURACIÓN REAL:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            twitch_clip.mp4


      # ============================================================
      # OBTENER METADATA DE PROYECTO 2
      # ============================================================

      - name: Build metadata from Project 2
        # CAMBIO AQUÍ: También adaptamos el nombre del clip para que sea elástico
        env:
          CLIP_FILENAME: ${{ github.event.client_payload.clip_filename || inputs.clip_filename }}

        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path


          clip_filename = os.environ["CLIP_FILENAME"]

          manifest_path = Path(
              "clips_manifest.json"
          )

          if not manifest_path.exists():
              raise FileNotFoundError(
                  "No existe clips_manifest.json."
              )


          with manifest_path.open(
              "r",
              encoding="utf-8",
          ) as file:
              manifest = json.load(file)


          if not isinstance(
              manifest,
              dict,
          ):
              raise ValueError(
                  "clips_manifest.json debe contener un objeto JSON."
              )


          clips = manifest.get(
              "clips",
              [],
          )


          if not isinstance(
              clips,
              list,
          ):
              raise ValueError(
                  "El campo 'clips' del manifest debe ser una lista."
              )


          selected_clip = None


          for clip in clips:

              if not isinstance(
                  clip,
                  dict,
              ):
                  continue


              file_value = str(
                  clip.get(
                      "file",
                      "",
                  )
              )


              file_name = Path(
                  file_value
              ).name


              if file_name == clip_filename:

                  selected_clip = clip
                  break


          if selected_clip is None:

              raise ValueError(
                  "No se encontró el clip solicitado "
                  f"'{clip_filename}' en clips_manifest.json."
              )


          # ========================================================
          # DATOS ORIGINALES DE PROYECTO 2
          # ========================================================

          title = str(
              selected_clip.get(
                  "title",
                  "",
              )
          ).strip()


          reason = str(
              selected_clip.get(
                  "reason",
                  "",
              )
          ).strip()


          category = str(
              selected_clip.get(
                  "category",
                  "",
              )
          ).strip()


          confidence = selected_clip.get(
              "confidence"
          )


          score_value = selected_clip.get(
              "score"
          )


          if not title:

              raise ValueError(
                  "El clip de Proyecto 2 no tiene título."
              )


          if score_value is None:

              raise ValueError(
                  "El clip de Proyecto 2 no tiene puntuación."
              )


          score_float = float(
              score_value
          )


          if not 0 <= score_float <= 100:

              raise ValueError(
                  "La puntuación de Proyecto 2 está fuera "
                  f"del rango 0-100: {score_float}"
              )


          # Si la puntuación es un número entero,
          # la guardamos como entero para que Telegram
          # muestre 88 en lugar de 88.0.

          if score_float.is_integer():

              score = int(
                  score_float
              )

          else:

              score = round(
                  score_float,
                  2,
              )


          # ========================================================
          # DESCRIPCIÓN
          # ========================================================
          #
          # Proyecto 2 genera "reason" como explicación del
          # potencial del momento.
          #
          # Lo utilizamos como descripción para Telegram/TikTok.
          # ========================================================

          description = reason


          if not description:

              description = (
                  f"Momento de categoría {category}."
                  if category
                  else "Momento destacado del directo."
              )


          # ========================================================
          # HASHTAGS
          # ========================================================

          hashtags = [
              "#Twitch",
              "#TwitchClips",
              "#TikTokGaming",
              "#Gaming",
          ]


          category_lower = category.lower()


          if category_lower in {
              "fail",
              "fallo",
              "error",
          }:

              hashtags.append(
                  "#Fail"
              )


          elif category_lower in {
              "funny",
              "gracioso",
              "gracia",
          }:

              hashtags.append(
                  "#Funny"
              )


          elif category_lower in {
              "susto",
              "scare",
              "sorpresa",
              "inesperado",
          }:

              hashtags.append(
                  "#WTF"
              )


          # Eliminamos duplicados conservando el orden.

          hashtags = list(
              dict.fromkeys(
                  hashtags
              )
          )


          # ========================================================
          # RECOMENDACIÓN
          # ========================================================

          if score >= 80:

              recommendation = "create_clip"

          elif score >= 60:

              recommendation = "consider_clip"

          elif score >= 40:

              recommendation = "review"

          else:

              recommendation = "discard"


          # ========================================================
          # METADATA FINAL
          # ========================================================

          metadata = {
              "language": "es",

              "title": title,

              "hook": "",

              "description": description,

              "hashtags": hashtags,

              "moment_type": category,

              "emotion": None,

              "score": score,

              "recommendation": recommendation,

              "confidence": confidence,

              "source": "twitch-vod-clip-agent",

              "source_clip_filename": clip_filename,
          }


          with open(
              "metadata.json",
              "w",
              encoding="utf-8",
          ) as file:

              json.dump(
                  metadata,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )


          # ========================================================
          # CREAR SCORED_RESPONSE COMPATIBLE
          # ========================================================
          #
          # No se utiliza para volver a puntuar.
          #
          # Lo dejamos como archivo informativo para mantener
          # compatibilidad con los artifacts del flujo anterior.
          # ========================================================

          scored_response = {
              "source": "twitch-vod-clip-agent",

              "source_clip_filename": clip_filename,

              "analysis": {
                  "title": title,
                  "description": description,
                  "moment_type": category,
              },

              "scoring": {
                  "score": score,
                  "category": (
                      "excellent"
                      if score >= 80
                      else "good"
                      if score >= 60
                      else "possible"
                      if score >= 40
                      else "weak"
                  ),
                  "recommendation": recommendation,
                  "source": "twitch-vod-clip-agent",
              },
          }


          with open(
              "scored_response.json",
              "w",
              encoding="utf-8",
          ) as file:

              json.dump(
                  scored_response,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )


          print()
          print("========================================")
          print("METADATA DE PROYECTO 2 UTILIZADA")
          print("========================================")
          print(
              f"Título: {title}"
          )
          print(
              f"Descripción: {description}"
          )
          print(
              f"Categoría: {category}"
          )
          print(
              f"Puntuación: {score}/100"
          )
          print(
              f"Confidence: {confidence}"
          )
          print(
              f"Recommendation: {recommendation}"
          )
          print(
              f"Fuente: twitch-vod-clip-agent"
          )
          print("========================================")
          PY


      - name: Show Project 2 metadata
        run: |
          echo "=============================="
          echo "METADATA RECIBIDA DE PROYECTO 2"
          echo "=============================="

          cat metadata.json


      # ============================================================
      # WHISPER
      # ============================================================

      - name: Run Whisper
        run: |
          python src/transcribe.py \
            twitch_clip.mp4 \
            output.txt


      - name: Show Whisper output
        run: |
          echo "=============================="
          echo "WHISPER OUTPUT"
          echo "=============================="

          cat output.txt


      - name: Show Whisper JSON
        run: |
          echo "=============================="
          echo "WHISPER JSON"
          echo "=============================="

          cat output.json


      # ============================================================
      # FORMATEAR SUBTÍTULOS
      # ============================================================

      - name: Format subtitles
        run: |
          python src/subtitle_formatter.py \
            output.json \
            formatted_subtitles.json


      - name: Show formatted subtitles
        run: |
          cat formatted_subtitles.json


      # ============================================================
      # CORREGIR FORMATO
      # ============================================================

      - name: Correct subtitles
        run: |
          python src/subtitle_corrector.py \
            formatted_subtitles.json \
            corrected_subtitles.json


      - name: Show corrected subtitles
        run: |
          cat corrected_subtitles.json


      # ============================================================
      # CREAR INPUT PARA GEMINI
      # ============================================================

      - name: Build AI input
        run: |
          python - <<'PY'
          import json

          with open(
              "corrected_subtitles.json",
              "r",
              encoding="utf-8",
          ) as file:
              subtitles = json.load(file)

          if not isinstance(
              subtitles,
              dict,
          ):
              raise ValueError(
                  "corrected_subtitles.json debe ser un objeto JSON."
              )

          segments = subtitles.get(
              "segments",
              [],
          )

          if not isinstance(
              segments,
              list,
          ):
              raise ValueError(
                  "'segments' debe ser una lista."
              )

          ai_input = {
              "language": subtitles.get(
                  "language",
                  "es",
              ),
              "segments": segments,
          }

          with open(
              "ai_input.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  ai_input,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )
          PY


      - name: Show AI input
        run: |
          cat ai_input.json


      # ============================================================
      # GEMINI
      # ============================================================
      #
      # IMPORTANTE:
      #
      # Gemini sigue utilizándose para revisar/corregir
      # la transcripción y preparar los subtítulos.
      #
      # NO se utiliza para decidir la puntuación del clip.
      # ============================================================

      - name: Analyze video with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          python src/gemini_analyzer.py \
            twitch_clip.mp4 \
            ai_input.json \
            ai_response.json


      - name: Show AI response
        run: |
          cat ai_response.json


      # ============================================================
      # VALIDAR RESPUESTA IA
      # ============================================================

      - name: Validate AI response
        run: |
          python src/ai_response_validator.py \
            ai_response.json


      # ============================================================
      # NO RECALCULAR SCORE
      # ============================================================
      #
      # INTENCIONADAMENTE NO EJECUTAMOS:
      #
      # python src/scoring.py
      #
      # La puntuación válida ya viene de Proyecto 2.
      # ============================================================

      - name: Verify Project 2 score is preserved
        run: |
          python - <<'PY'
          import json

          with open(
              "metadata.json",
              "r",
              encoding="utf-8",
          ) as file:
              metadata = json.load(file)

          score = metadata.get(
              "score"
          )

          title = metadata.get(
              "title"
          )

          description = metadata.get(
              "description"
          )


          if score is None:
              raise ValueError(
                  "metadata.json no contiene score."
              )


          if not title:
              raise ValueError(
                  "metadata.json no contiene title."
              )


          if not description:
              raise ValueError(
                  "metadata.json no contiene description."
              )


          print(
              "========================================"
          )

          print(
              "DATOS DE PROYECTO 2 CONSERVADOS"
          )

          print(
              "========================================"
          )

          print(
              f"Título: {title}"
          )

          print(
              f"Descripción: {description}"
          )

          print(
              f"Puntuación: {score}/100"
          )

          print(
              "========================================"
          )
          PY


      # ============================================================
      # SUBTÍTULOS FINALES
      # ============================================================

      - name: Build final subtitles
        run: |
          python src/ai_response_handler.py \
            ai_response.json \
            corrected_subtitles.json \
            final_subtitles.txt


      - name: Show final subtitles
        run: |
          cat final_subtitles.txt


      # ============================================================
      # QUEMAR SUBTÍTULOS
      # ============================================================

      - name: Burn subtitles into TikTok video
        run: |
          python src/subtitle_burner.py \
            twitch_clip.mp4 \
            final_subtitles.txt \
            final_tiktok.mp4


      - name: Check final video
        run: |
          if [ ! -f final_tiktok.mp4 ]; then
            echo "ERROR: No se ha creado final_tiktok.mp4"
            exit 1
          fi

          echo "Vídeo final:"
          ls -lh final_tiktok.mp4

          echo ""
          echo "Duración final:"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            final_tiktok.mp4


      # ============================================================
      # CREAR ESTADO DE REVISIÓN
      # ============================================================

      - name: Create review state
        run: |
          python src/review_manager.py \
            create \
            metadata.json \
            review_state.json


      - name: Show review state
        run: |
          echo "=============================="
          echo "REVIEW STATE"
          echo "=============================="

          cat review_state.json


      # ============================================================
      # TELEGRAM REVIEW
      # ============================================================

      - name: Telegram review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python src/telegram_review.py \
            final_tiktok.mp4 \
            metadata.json \
            review_state.json \
            final_subtitles.txt \
            twitch_clip.mp4 \
            7200


      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload processed external clip
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: processed-external-clip-${{ github.run_id }}

          path: |
            twitch_clip.mp4
            final_tiktok.mp4
            metadata.json
            review_state.json
            final_subtitles.txt
            ai_response.json
            scored_response.json
            clips_manifest.json

          if-no-files-found: ignore
